<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recipe Book — kittisap.me</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fdf8f0; --bg2:#fef9f2; --surface:#fff; --surface2:#faf5ec;
  --border:rgba(139,90,43,0.12); --border2:rgba(139,90,43,0.25);
  --brown:#5c3317; --brown2:#8b5a2b; --brown3:#c49a6c;
  --cream:#fdf0d5; --cream2:#fae8c8;
  --green:#3a6b45; --green-bg:rgba(58,107,69,0.08);
  --red:#c0392b; --red-bg:rgba(192,57,43,0.08);
  --gold:#d4a017; --gold-bg:rgba(212,160,23,0.1);
  --text:#2c1a0e; --text2:#6b4226; --text3:#a07850;
  --radius:14px; --radius-sm:9px; --radius-xs:6px;
  --shadow:rgba(92,51,23,0.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(253,248,240,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar-brand{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--brown);display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:6px}
.back-btn{font-size:.7rem;color:var(--text3);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);transition:all .2s}
.back-btn:hover{background:var(--cream);color:var(--brown)}
.nav-tab{font-size:.72rem;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-weight:500}
.nav-tab.active{background:var(--brown);color:white;border-color:var(--brown)}
.nav-tab:hover:not(.active){background:var(--cream);color:var(--brown)}

/* ── WRAP ── */
.wrap{max-width:680px;margin:0 auto;padding:20px 16px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}

/* ── SEARCH & FILTER ── */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--border2)}
.search-input::placeholder{color:var(--text3)}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fchip{font-size:.65rem;padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;font-weight:500}
.fchip.active{background:var(--brown);color:white;border-color:var(--brown)}
.fchip:hover:not(.active){background:var(--cream);color:var(--brown)}
.btn-add{font-size:.78rem;padding:9px 16px;border-radius:var(--radius-sm);background:var(--brown);color:white;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.btn-add:hover{background:var(--brown2);transform:translateY(-1px)}

/* ── RECIPE GRID ── */
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .25s}
.recipe-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 6px 24px var(--shadow)}
.recipe-card-img{width:100%;height:110px;object-fit:cover;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.recipe-card-body{padding:12px}
.recipe-card-cat{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brown3);margin-bottom:4px}
.recipe-card-name{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--brown);font-weight:600;margin-bottom:6px;line-height:1.3}
.recipe-card-meta{display:flex;justify-content:space-between;align-items:center}
.recipe-cost{font-size:.72rem;font-weight:600;color:var(--green);font-family:'DM Sans',sans-serif}
.recipe-yield{font-size:.68rem;color:var(--text3)}

/* ── RECIPE DETAIL ── */
.detail-hero{background:var(--cream);border-radius:var(--radius);padding:20px;margin-bottom:18px;border:1px solid var(--border)}
.detail-cat{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brown3);margin-bottom:6px}
.detail-name{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--brown);font-weight:600;margin-bottom:8px;line-height:1.3}
.detail-desc{font-size:.88rem;color:var(--text2);font-weight:300;line-height:1.7;margin-bottom:14px}
.detail-meta-row{display:flex;gap:12px;flex-wrap:wrap}
.detail-meta-chip{background:white;border:1px solid var(--border);border-radius:100px;padding:5px 14px;font-size:.72rem;color:var(--text2);font-weight:500}
.detail-meta-chip strong{color:var(--brown);font-weight:700}

/* ── SCALE CONTROL ── */
.scale-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:18px}
.scale-label{font-size:.72rem;color:var(--text3);font-weight:500;flex:1}
.scale-btn{width:30px;height:30px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg);color:var(--brown);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;font-weight:600}
.scale-btn:hover{background:var(--cream);border-color:var(--border2)}
.scale-val{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--brown);font-weight:600;min-width:24px;text-align:center}

/* ── COST CARD ── */
.cost-card{background:linear-gradient(135deg,var(--green-bg),rgba(58,107,69,0.04));border:1px solid rgba(58,107,69,0.2);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
.cost-card-title{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
.cost-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(58,107,69,0.08)}
.cost-row:last-child{border-bottom:none;margin-top:4px;padding-top:10px}
.cost-name{font-size:.84rem;color:var(--text2)}
.cost-amount{font-size:.8rem;color:var(--text3);font-family:'DM Sans',sans-serif}
.cost-price{font-size:.84rem;font-weight:600;color:var(--green);font-family:'DM Sans',sans-serif}
.cost-total-label{font-size:.84rem;font-weight:700;color:var(--text);font-family:'Playfair Display',serif}
.cost-total-val{font-size:1.1rem;font-weight:700;color:var(--green);font-family:'DM Sans',sans-serif}
.cost-per-piece{text-align:right;margin-top:8px;font-size:.8rem;color:var(--text3)}
.cost-per-piece strong{color:var(--brown);font-weight:700}

/* ── INGREDIENTS SECTION ── */
.section-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--brown);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:16px;background:var(--brown3);border-radius:2px;display:inline-block}
.ing-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.ing-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.ing-name{font-size:.88rem;color:var(--text);font-weight:500}
.ing-amount{font-size:.82rem;color:var(--text2);font-family:'DM Sans',sans-serif}
.ing-cost{font-size:.75rem;color:var(--text3);font-family:'DM Sans',sans-serif}

/* ── STEPS ── */
.steps-list{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.step-row{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--brown);color:white;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;font-family:'DM Sans',sans-serif}
.step-text{font-size:.88rem;color:var(--text);line-height:1.7;font-weight:300;padding-top:4px}

/* ── INGREDIENTS DB ── */
.ing-db-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);transition:background .15s}
.ing-db-row:first-child{border-radius:var(--radius) var(--radius) 0 0}
.ing-db-row:last-child{border-bottom:none;border-radius:0 0 var(--radius) var(--radius)}
.ing-db-row:hover{background:var(--bg2)}
.ing-db-name{font-size:.88rem;font-weight:500;color:var(--text)}
.ing-db-meta{font-size:.72rem;color:var(--text3);font-family:'DM Sans',sans-serif;margin-top:2px}
.ing-db-price{font-size:.82rem;font-weight:600;color:var(--green);font-family:'DM Sans',sans-serif;text-align:right}
.ing-db-price-per{font-size:.65rem;color:var(--text3);margin-top:2px}
.ing-db-actions{display:flex;gap:6px;margin-left:12px}
.btn-icon{width:28px;height:28px;border-radius:var(--radius-xs);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.btn-icon:hover{background:var(--cream);color:var(--brown)}
.btn-icon.danger:hover{background:var(--red-bg);color:var(--red);border-color:rgba(192,57,43,.2)}
.ing-db-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}

/* ── FORM ── */
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.form-section-title{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--brown);font-weight:600;margin-bottom:16px}
.f-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.f-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;width:100%}
.f-input:focus{border-color:var(--border2);background:white}
.f-input::placeholder{color:var(--text3)}
select.f-input option{background:var(--bg)}
textarea.f-input{resize:none;line-height:1.6}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-hint{font-size:.65rem;color:var(--text3);margin-top:3px;font-style:italic}
.form-ing-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;padding:10px;background:var(--bg);border-radius:var(--radius-xs);border:1px solid var(--border)}
.form-ing-row .f-input{background:white}
.btn-remove-ing{width:28px;height:28px;border-radius:var(--radius-xs);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;flex-shrink:0;font-size:.8rem;transition:all .2s}
.btn-remove-ing:hover{background:var(--red-bg);color:var(--red)}
.form-step-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.step-num-badge{width:24px;height:24px;border-radius:50%;background:var(--brown);color:white;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex-shrink:0;margin-top:10px}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:2.5rem;margin-bottom:10px;opacity:.5}

/* ── BOTTOM BTNS ── */
.btn-primary{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--brown);color:white;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;border:none;cursor:pointer;transition:all .2s;margin-bottom:10px}
.btn-primary:hover{background:var(--brown2);transform:translateY(-1px)}
.btn-secondary{width:100%;padding:11px;border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:500;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.btn-secondary:hover{background:var(--cream);color:var(--brown)}

/* ── LOADING ── */
.loading{text-align:center;padding:32px;color:var(--text3);font-size:.84rem}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--brown3);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:var(--brown);color:white;border-radius:var(--radius-sm);padding:10px 20px;font-size:.78rem;z-index:200;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── NOTES ── */
.notes-box{background:var(--gold-bg);border:1px solid rgba(212,160,23,.25);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px}
.notes-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.notes-text{font-size:.84rem;color:var(--text2);line-height:1.75;font-weight:300;font-style:italic}

@media(max-width:480px){
  .recipe-grid{grid-template-columns:1fr 1fr}
  .f-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">🍪 Recipe Book</div>
  <div class="topbar-right">
    <button class="nav-tab active" id="tabRecipes" onclick="switchTab('recipes')">สูตรขนม</button>
    <button class="nav-tab" id="tabIngredients" onclick="switchTab('ingredients')">วัตถุดิบ</button>
    <a href="../" class="back-btn">← Portal</a>
  </div>
</header>

<div class="wrap">

  <!-- ── RECIPES LIST ── -->
  <div id="screen-recipes" class="screen active">
    <div class="search-row">
      <input type="text" class="search-input" id="recipeSearch" placeholder="🔍 ค้นหาสูตร..." oninput="filterRecipes()">
      <button class="btn-add" onclick="showAddRecipe()">+ เพิ่มสูตร</button>
    </div>
    <div class="filter-row" id="recipeFilters">
      <button class="fchip active" onclick="setRecipeFilter('all',this)">ทั้งหมด</button>
    </div>
    <div id="recipeGrid" class="recipe-grid">
      <div class="loading" style="grid-column:1/-1"><span class="spinner"></span>กำลังโหลด...</div>
    </div>
  </div>

  <!-- ── RECIPE DETAIL ── -->
  <div id="screen-detail" class="screen">
    <button class="btn-secondary" style="margin-bottom:16px;width:auto;padding:8px 16px" onclick="goRecipes()">← กลับ</button>
    <div id="detailContent"></div>
  </div>

  <!-- ── ADD/EDIT RECIPE ── -->
  <div id="screen-add-recipe" class="screen">
    <button class="btn-secondary" style="margin-bottom:16px;width:auto;padding:8px 16px" onclick="goRecipes()">← กลับ</button>
    <div class="form-section">
      <div class="form-section-title">ข้อมูลสูตรขนม</div>
      <div class="f-group"><label class="f-label">ชื่อสูตร *</label><input id="r_name" class="f-input" placeholder="เช่น คุกกี้เนยสด, เค้กช็อกโกแลต"></div>
      <div class="f-group"><label class="f-label">หมวดหมู่</label>
        <select id="r_cat" class="f-input">
          <option value="">เลือกหมวดหมู่...</option>
          <option value="คุกกี้">คุกกี้</option>
          <option value="เค้ก">เค้ก</option>
          <option value="ขนมปัง">ขนมปัง</option>
          <option value="มัฟฟิน">มัฟฟิน</option>
          <option value="บราวนี่">บราวนี่</option>
          <option value="ครัวซ็องต์">ครัวซ็องต์</option>
          <option value="ขนมไทย">ขนมไทย</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>
      <div class="f-group"><label class="f-label">คำอธิบาย</label><textarea id="r_desc" class="f-input" rows="2" placeholder="บอกเล่าสั้นๆ ว่าขนมนี้พิเศษอย่างไร"></textarea></div>
      <div class="f-grid">
        <div class="f-group"><label class="f-label">ได้กี่ชิ้น/อัน</label><input type="number" id="r_yield" class="f-input" placeholder="24" min="1"><div class="f-hint">ต่อ 1 batch</div></div>
        <div class="f-group"><label class="f-label">หน่วย</label><input id="r_unit" class="f-input" placeholder="ชิ้น"></div>
      </div>
      <div class="f-group"><label class="f-label">Image URL (optional)</label><input id="r_img" class="f-input" placeholder="https://..."></div>
      <div class="f-group"><label class="f-label">หมายเหตุ/เคล็ดลับ</label><textarea id="r_notes" class="f-input" rows="2" placeholder="เช่น อย่าใช้เนยละลาย, พักแป้งอย่างน้อย 30 นาที..."></textarea></div>
    </div>

    <div class="form-section">
      <div class="form-section-title">วัตถุดิบ</div>
      <div id="recipeIngRows"></div>
      <button class="btn-secondary" onclick="addIngRow()">+ เพิ่มวัตถุดิบ</button>
    </div>

    <div class="form-section">
      <div class="form-section-title">ขั้นตอนการทำ</div>
      <div id="recipeStepRows"></div>
      <button class="btn-secondary" onclick="addStepRow()">+ เพิ่มขั้นตอน</button>
    </div>

    <button class="btn-primary" onclick="saveRecipe()">💾 บันทึกสูตร</button>
    <button class="btn-secondary" id="deleteRecipeBtn" style="display:none;color:var(--red)" onclick="deleteRecipe()">🗑 ลบสูตรนี้</button>
  </div>

  <!-- ── INGREDIENTS DB ── -->
  <div id="screen-ingredients" class="screen">
    <div class="search-row" style="margin-bottom:14px">
      <input type="text" class="search-input" id="ingSearch" placeholder="🔍 ค้นหาวัตถุดิบ..." oninput="filterIngredients()">
      <button class="btn-add" onclick="showAddIngredient()">+ เพิ่ม</button>
    </div>
    <div class="ing-db-container" id="ingDbList">
      <div class="loading"><span class="spinner"></span>กำลังโหลด...</div>
    </div>
  </div>

  <!-- ── ADD INGREDIENT ── -->
  <div id="screen-add-ingredient" class="screen">
    <button class="btn-secondary" style="margin-bottom:16px;width:auto;padding:8px 16px" onclick="switchTab('ingredients')">← กลับ</button>
    <div class="form-section">
      <div class="form-section-title" id="ingFormTitle">เพิ่มวัตถุดิบใหม่</div>
      <div class="f-group"><label class="f-label">ชื่อวัตถุดิบ *</label><input id="i_name" class="f-input" placeholder="เช่น แป้งสาลี, เนยสด, น้ำตาลทราย"></div>
      <div class="f-grid">
        <div class="f-group"><label class="f-label">ขนาดแพคเกจ *</label><input type="number" id="i_pkg_size" class="f-input" placeholder="1000" oninput="calcPricePerUnit()"></div>
        <div class="f-group"><label class="f-label">หน่วย *</label>
          <select id="i_unit" class="f-input">
            <option value="g">g (กรัม)</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">ลิตร</option>
            <option value="ชิ้น">ชิ้น</option>
            <option value="ถุง">ถุง</option>
            <option value="กล่อง">กล่อง</option>
            <option value="ฟอง">ฟอง</option>
          </select>
        </div>
      </div>
      <div class="f-group"><label class="f-label">ราคาต่อแพคเกจ (฿) *</label><input type="number" id="i_pkg_price" class="f-input" placeholder="45" step="0.01" oninput="calcPricePerUnit()"></div>
      <div class="f-group" style="background:var(--green-bg);border-radius:var(--radius-sm);padding:12px">
        <label class="f-label" style="color:var(--green)">ราคาต่อหน่วย (คำนวณอัตโนมัติ)</label>
        <div id="pricePerUnit" style="font-size:1rem;font-weight:700;color:var(--green);margin-top:4px;font-family:'DM Sans',sans-serif">—</div>
      </div>

    <input type="hidden" id="i_edit_id">
    <button class="btn-primary" onclick="saveIngredient()">💾 บันทึกวัตถุดิบ</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://qquxotxrwnzxyutzlwim.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxdXhvdHhyd256eHl1dHpsd2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNzU5MDEsImV4cCI6MjA5NDY1MTkwMX0.vEu40LwSAhWhu1T4Mm_uFeWD3YRjptg0q0VshnYUXHM';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let allRecipes = [], allIngredients = [], allCategories = new Set();
let recipeFilter = 'all', currentScale = 1, editingRecipeId = null;
let recipeIngRows = [], recipeStepRows = [];

// ── INIT ──
async function init() {
  await Promise.all([loadRecipes(), loadIngredients()]);
}

// ── RECIPES ──
async function loadRecipes() {
  const { data } = await db.from('recipes').select('*').order('created_at', {ascending:false});
  allRecipes = data || [];
  allCategories = new Set(allRecipes.map(r=>r.category).filter(Boolean));
  renderCategoryFilters();
  filterRecipes();
}

function renderCategoryFilters() {
  const row = document.getElementById('recipeFilters');
  const cats = ['ทั้งหมด', ...allCategories];
  row.innerHTML = cats.map((c,i) => `
    <button class="fchip ${i===0&&recipeFilter==='all'?'active':recipeFilter===c?'active':''}"
      onclick="setRecipeFilter('${c==='ทั้งหมด'?'all':c}',this)">${c}</button>`).join('');
}

function setRecipeFilter(f, btn) {
  recipeFilter = f;
  document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterRecipes();
}

function filterRecipes() {
  const q = document.getElementById('recipeSearch').value.toLowerCase().trim();
  let filtered = allRecipes;
  if(recipeFilter !== 'all') filtered = filtered.filter(r=>r.category===recipeFilter);
  if(q) filtered = filtered.filter(r=>r.name.toLowerCase().includes(q));
  renderRecipeGrid(filtered);
}

function renderRecipeGrid(recipes) {
  const grid = document.getElementById('recipeGrid');
  if(!recipes.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🍪</div><div>ยังไม่มีสูตร — กด + เพิ่มสูตรได้เลยครับ</div></div>';
    return;
  }
  grid.innerHTML = recipes.map(r => {
    const cost = calcRecipeCost(r.id, 1);
    const perPiece = r.yield_qty > 0 ? (cost / r.yield_qty).toFixed(2) : null;
    const imgEl = r.image_url
      ? `<img src="${r.image_url}" alt="${r.name}" class="recipe-card-img" onerror="this.outerHTML='<div class=recipe-card-img style=font-size:2.5rem;display:flex;align-items:center;justify-content:center>🍪</div>'">`
      : `<div class="recipe-card-img">🍪</div>`;
    return `<div class="recipe-card" onclick="showDetail('${r.id}')">
      ${imgEl}
      <div class="recipe-card-body">
        <div class="recipe-card-cat">${r.category||'ขนม'}</div>
        <div class="recipe-card-name">${r.name}</div>
        <div class="recipe-card-meta">
          <div class="recipe-cost">${cost>0?'฿'+cost.toFixed(2)+'/batch':'—'}</div>
          <div class="recipe-yield">${r.yield_qty||'?'} ${r.yield_unit||'ชิ้น'}</div>
        </div>
        ${perPiece&&cost>0?`<div style="font-size:.65rem;color:var(--text3);margin-top:3px">฿${perPiece}/ชิ้น</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── CALC COST ──
function calcRecipeCost(recipeId, scale) {
  // Uses cached ingredient data
  const recipeIngs = (window._recipeIngCache||{})[recipeId] || [];
  let total = 0;
  recipeIngs.forEach(ri => {
    const ing = allIngredients.find(i=>i.id===ri.ingredient_id);
    if(!ing) return;
    const ppu = ing.package_size > 0 ? ing.package_price / ing.package_size : 0;
    total += ppu * ri.amount * scale;
  });
  return total;
}

// ── RECIPE DETAIL ──
async function showDetail(id) {
  showScreen('detail');
  document.getElementById('detailContent').innerHTML = '<div class="loading"><span class="spinner"></span>กำลังโหลด...</div>';
  currentScale = 1;

  const recipe = allRecipes.find(r=>r.id===id);
  if(!recipe){ document.getElementById('detailContent').innerHTML = '<div class="empty">ไม่พบสูตร</div>'; return; }

  // Load ingredients + steps
  const [{ data: ings }, { data: steps }] = await Promise.all([
    db.from('recipe_ingredients').select('*,ingredients(*)').eq('recipe_id', id).order('created_at'),
    db.from('recipe_steps').select('*').eq('recipe_id', id).order('step_order'),
  ]);

  // Cache for cost calc
  if(!window._recipeIngCache) window._recipeIngCache = {};
  window._recipeIngCache[id] = ings||[];

  window._currentDetail = { recipe, ings: ings||[], steps: steps||[] };
  renderDetail();
}

function renderDetail() {
  const { recipe, ings, steps } = window._currentDetail;
  const scale = currentScale;

  // Cost calculation
  let totalCost = 0;
  const costRows = ings.map(ri => {
    const ing = ri.ingredients;
    if(!ing) return null;
    const ppu = ing.package_size > 0 ? ing.package_price / ing.package_size : 0;
    const cost = ppu * ri.amount * scale;
    totalCost += cost;
    return { name: ing.name, amount: ri.amount * scale, unit: ri.unit||ing.unit, cost, ppu };
  }).filter(Boolean);
  const perPiece = recipe.yield_qty > 0 ? totalCost / recipe.yield_qty : 0;

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero">
      ${recipe.image_url?`<img src="${recipe.image_url}" style="width:100%;height:160px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:14px;display:block" onerror="this.remove()">`:''}
      <div class="detail-cat">${recipe.category||'ขนม'}</div>
      <div class="detail-name">${recipe.name}</div>
      ${recipe.description?`<div class="detail-desc">${recipe.description}</div>`:''}
      <div class="detail-meta-row">
        <div class="detail-meta-chip">ได้ <strong>${(recipe.yield_qty||0)*scale} ${recipe.yield_unit||'ชิ้น'}</strong></div>
        ${scale>1?`<div class="detail-meta-chip">×${scale} batch</div>`:''}
      </div>
    </div>

    <div class="scale-row">
      <div class="scale-label">ปรับขนาด Batch</div>
      <button class="scale-btn" onclick="setScale(${scale-1})">−</button>
      <div class="scale-val">×${scale}</div>
      <button class="scale-btn" onclick="setScale(${scale+1})">+</button>
    </div>

    ${totalCost > 0 ? `
    <div class="cost-card">
      <div class="cost-card-title">💰 ต้นทุน${scale>1?' (×'+scale+' Batch)':''}</div>
      ${costRows.map(r=>`
        <div class="cost-row">
          <div>
            <div class="cost-name">${r.name}</div>
            <div class="cost-amount">${r.amount} ${r.unit}</div>
          </div>
          <div class="cost-price">฿${r.cost.toFixed(2)}</div>
        </div>`).join('')}
      <div class="cost-row">
        <div class="cost-total-label">รวมต้นทุน</div>
        <div class="cost-total-val">฿${totalCost.toFixed(2)}</div>
      </div>
      ${perPiece>0?`<div class="cost-per-piece">ต้นทุนต่อ${recipe.yield_unit||'ชิ้น'}: <strong>฿${perPiece.toFixed(2)}</strong></div>`:''}
    </div>` : ''}

    <div class="section-title">วัตถุดิบ</div>
    <div class="ing-list">
      ${ings.length ? ings.map(ri=>{
        const ing = ri.ingredients;
        const ppu = ing&&ing.package_size>0 ? ing.package_price/ing.package_size : 0;
        const cost = ppu * ri.amount * scale;
        return `<div class="ing-row">
          <div>
            <div class="ing-name">${ing?.name||'—'}</div>
            ${cost>0?`<div class="ing-cost">฿${(ppu).toFixed(3)}/${ri.unit||ing?.unit} → ฿${cost.toFixed(2)}</div>`:''}
          </div>
          <div class="ing-amount">${ri.amount*scale} ${ri.unit||ing?.unit||''}</div>
        </div>`;
      }).join('') : '<div style="color:var(--text3);font-size:.84rem;padding:10px 0">ยังไม่ได้ระบุวัตถุดิบ</div>'}
    </div>

    ${steps.length ? `
    <div class="section-title">ขั้นตอนการทำ</div>
    <div class="steps-list">
      ${steps.map(s=>`
        <div class="step-row">
          <div class="step-num">${s.step_order}</div>
          <div class="step-text">${s.description}</div>
        </div>`).join('')}
    </div>` : ''}

    ${recipe.notes ? `
    <div class="notes-box">
      <div class="notes-label">💡 เคล็ดลับ</div>
      <div class="notes-text">${recipe.notes}</div>
    </div>` : ''}

    <div style="display:flex;gap:10px">
      <button class="btn-secondary" style="flex:1" onclick="editRecipe('${recipe.id}')">✏️ แก้ไขสูตร</button>
<button class="btn-secondary" style="flex:1" onclick="copyRecipe('${recipe.id}')">📋 Copy สูตร</button>
    </div>
  `;
}

function setScale(n) {
  if(n < 1) return;
  currentScale = n;
  renderDetail();
}

// ── ADD/EDIT RECIPE ──
function showAddRecipe() {
  editingRecipeId = null;
  ['r_name','r_desc','r_img','r_notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('r_cat').value='';
  document.getElementById('r_yield').value='';
  document.getElementById('r_unit').value='';
  document.getElementById('deleteRecipeBtn').style.display='none';
  recipeIngRows = []; recipeStepRows = [];
  renderIngRows(); renderStepRows();
  addIngRow(); addStepRow();
  showScreen('add-recipe');
}

async function editRecipe(id) {
  editingRecipeId = id;
  const recipe = allRecipes.find(r=>r.id===id);
  if(!recipe) return;
  document.getElementById('r_name').value = recipe.name||'';
  document.getElementById('r_cat').value = recipe.category||'';
  document.getElementById('r_desc').value = recipe.description||'';
  document.getElementById('r_yield').value = recipe.yield_qty||'';
  document.getElementById('r_unit').value = recipe.yield_unit||'';
  document.getElementById('r_img').value = recipe.image_url||'';
  document.getElementById('r_notes').value = recipe.notes||'';
  document.getElementById('deleteRecipeBtn').style.display='block';

  const [{ data: ings }, { data: steps }] = await Promise.all([
    db.from('recipe_ingredients').select('*').eq('recipe_id', id).order('created_at'),
    db.from('recipe_steps').select('*').eq('recipe_id', id).order('step_order'),
  ]);

  recipeIngRows = (ings||[]).map(ri=>({ ingId:ri.ingredient_id, amount:ri.amount, unit:ri.unit, dbId:ri.id }));
  recipeStepRows = (steps||[]).map(s=>({ text:s.description, dbId:s.id }));
  renderIngRows(); renderStepRows();
  showScreen('add-recipe');
}

function renderIngRows() {
  const container = document.getElementById('recipeIngRows');
  container.innerHTML = recipeIngRows.map((row,i) => `
    <div class="form-ing-row">
      <select class="f-input" style="flex:2" onchange="recipeIngRows[${i}].ingId=this.value">
        <option value="">เลือกวัตถุดิบ...</option>
        ${allIngredients.map(ing=>`<option value="${ing.id}" ${row.ingId===ing.id?'selected':''}>${ing.name} (${ing.unit})</option>`).join('')}
      </select>
      <input type="number" class="f-input" style="flex:1;min-width:70px" placeholder="จำนวน" value="${row.amount||''}"
        oninput="recipeIngRows[${i}].amount=parseFloat(this.value)||0">
      <input class="f-input" style="flex:1;min-width:50px" placeholder="หน่วย" value="${row.unit||''}"
        oninput="recipeIngRows[${i}].unit=this.value">
      <button class="btn-remove-ing" onclick="removeIngRow(${i})">✕</button>
    </div>`).join('');
}

function renderStepRows() {
  const container = document.getElementById('recipeStepRows');
  container.innerHTML = recipeStepRows.map((row,i) => `
    <div class="form-step-row">
      <div class="step-num-badge">${i+1}</div>
      <textarea class="f-input" rows="2" placeholder="อธิบายขั้นตอน..." style="flex:1"
        oninput="recipeStepRows[${i}].text=this.value">${row.text||''}</textarea>
      <button class="btn-remove-ing" onclick="removeStepRow(${i})" style="margin-top:8px">✕</button>
    </div>`).join('');
}

function addIngRow() { recipeIngRows.push({ingId:'',amount:0,unit:''}); renderIngRows(); }
function addStepRow() { recipeStepRows.push({text:''}); renderStepRows(); }
function removeIngRow(i) { recipeIngRows.splice(i,1); renderIngRows(); }
function removeStepRow(i) { recipeStepRows.splice(i,1); renderStepRows(); }

async function saveRecipe() {
  const name = document.getElementById('r_name').value.trim();
  if(!name){ showToast('กรุณาใส่ชื่อสูตร'); return; }
  const payload = {
    name, category: document.getElementById('r_cat').value||null,
    description: document.getElementById('r_desc').value.trim()||null,
    yield_qty: parseFloat(document.getElementById('r_yield').value)||null,
    yield_unit: document.getElementById('r_unit').value.trim()||'ชิ้น',
    image_url: document.getElementById('r_img').value.trim()||null,
    notes: document.getElementById('r_notes').value.trim()||null,
  };

  let recipeId = editingRecipeId;
  if(editingRecipeId) {
    await db.from('recipes').update(payload).eq('id', editingRecipeId);
    // Delete old ings + steps
    await Promise.all([
      db.from('recipe_ingredients').delete().eq('recipe_id', editingRecipeId),
      db.from('recipe_steps').delete().eq('recipe_id', editingRecipeId),
    ]);
  } else {
    const { data } = await db.from('recipes').insert(payload).select().single();
    recipeId = data.id;
  }

  // Insert ingredients
  const ingInserts = recipeIngRows.filter(r=>r.ingId&&r.amount).map(r=>({
    recipe_id:recipeId, ingredient_id:r.ingId, amount:r.amount, unit:r.unit||null
  }));
  if(ingInserts.length) await db.from('recipe_ingredients').insert(ingInserts);

  // Insert steps
  const stepInserts = recipeStepRows.filter(r=>r.text.trim()).map((r,i)=>({
    recipe_id:recipeId, step_order:i+1, description:r.text.trim()
  }));
  if(stepInserts.length) await db.from('recipe_steps').insert(stepInserts);

  showToast('✓ บันทึกสูตรแล้ว');
  await loadRecipes();
  goRecipes();
}

async function deleteRecipe() {
  if(!editingRecipeId||!confirm('ลบสูตรนี้?')) return;
  await db.from('recipes').delete().eq('id', editingRecipeId);
  showToast('ลบแล้ว','info');
  await loadRecipes();
  goRecipes();
}

// ── INGREDIENTS DB ──
async function loadIngredients() {
  const { data } = await db.from('ingredients').select('*').order('name');
  allIngredients = data||[];
  filterIngredients();
}

function filterIngredients() {
  const q = (document.getElementById('ingSearch')?.value||'').toLowerCase();
  const filtered = q ? allIngredients.filter(i=>i.name.toLowerCase().includes(q)) : allIngredients;
  const el = document.getElementById('ingDbList');
  if(!filtered.length){ el.innerHTML='<div class="loading" style="color:var(--text3)">ยังไม่มีวัตถุดิบ</div>'; return; }
  el.innerHTML = filtered.map(i=>{
    const ppu = i.package_size>0 ? i.package_price/i.package_size : 0;
    return `<div class="ing-db-row">
      <div style="flex:1;min-width:0">
        <div class="ing-db-name">${i.name}</div>
        <div class="ing-db-meta">แพค ${i.package_size} ${i.unit} = ฿${i.package_price}</div>
      </div>
      <div>
        <div class="ing-db-price">฿${ppu.toFixed(3)}</div>
        <div class="ing-db-price-per">ต่อ ${i.unit}</div>
      </div>
      <div class="ing-db-actions">
        <button class="btn-icon" onclick="editIngredient('${i.id}')" title="แก้ไข">✏️</button>
        <button class="btn-icon danger" onclick="deleteIngredient('${i.id}')" title="ลบ">✕</button>
      </div>
    </div>`;
  }).join('');
}

function showAddIngredient() {
  ['i_name','i_pkg_size','i_pkg_price'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('i_unit').value='g';
  document.getElementById('i_edit_id').value='';
  document.getElementById('ingFormTitle').textContent='เพิ่มวัตถุดิบใหม่';
  document.getElementById('pricePerUnit').textContent='—';
  showScreen('add-ingredient');
}

function editIngredient(id) {
  const ing = allIngredients.find(i=>i.id===id);
  if(!ing) return;
  document.getElementById('i_name').value = ing.name;
  document.getElementById('i_pkg_size').value = ing.package_size||'';
  document.getElementById('i_unit').value = ing.unit;
  document.getElementById('i_pkg_price').value = ing.package_price||'';
  document.getElementById('i_edit_id').value = id;
  document.getElementById('ingFormTitle').textContent = 'แก้ไขวัตถุดิบ';
  calcPricePerUnit();
  showScreen('add-ingredient');
}

async function deleteIngredient(id) {
  if(!confirm('ลบวัตถุดิบนี้?')) return;
  await db.from('ingredients').delete().eq('id', id);
  showToast('ลบแล้ว');
  await loadIngredients();
}

function calcPricePerUnit() {
  const size = parseFloat(document.getElementById('i_pkg_size').value)||0;
  const price = parseFloat(document.getElementById('i_pkg_price').value)||0;
  const unit = document.getElementById('i_unit').value;
  const el = document.getElementById('pricePerUnit');
  if(size>0&&price>0) el.textContent = `฿${(price/size).toFixed(4)} / ${unit}`;
  else el.textContent = '—';
}

async function saveIngredient() {
  const name = document.getElementById('i_name').value.trim();
  const pkg_size = parseFloat(document.getElementById('i_pkg_size').value)||0;
  const pkg_price = parseFloat(document.getElementById('i_pkg_price').value)||0;
  const unit = document.getElementById('i_unit').value;
  const editId = document.getElementById('i_edit_id').value;
  if(!name||!pkg_size||!pkg_price){ showToast('กรุณากรอกข้อมูลให้ครบ'); return; }
  const payload = { name, package_size:pkg_size, package_price:pkg_price, unit };
  if(editId) await db.from('ingredients').update(payload).eq('id', editId);
  else await db.from('ingredients').insert(payload);
  showToast('✓ บันทึกแล้ว');
  await loadIngredients();
  switchTab('ingredients');
}
async function copyRecipe(id) {
  const recipe = allRecipes.find(r=>r.id===id);
  if(!recipe) return;

  // Load ings + steps ของต้นฉบับ
  const [{ data: ings }, { data: steps }] = await Promise.all([
    db.from('recipe_ingredients').select('*').eq('recipe_id', id).order('created_at'),
    db.from('recipe_steps').select('*').eq('recipe_id', id).order('step_order'),
  ]);

  // Insert recipe ใหม่ (เปลี่ยนชื่อ + clear id)
  const { data: newRecipe } = await db.from('recipes').insert({
    name: recipe.name + ' (Copy)',
    category: recipe.category,
    description: recipe.description,
    yield_qty: recipe.yield_qty,
    yield_unit: recipe.yield_unit,
    image_url: recipe.image_url,
    notes: recipe.notes,
  }).select().single();

  // Insert ings + steps ของ copy
  if(ings?.length) await db.from('recipe_ingredients').insert(
    ings.map(ri=>({ recipe_id:newRecipe.id, ingredient_id:ri.ingredient_id, amount:ri.amount, unit:ri.unit }))
  );
  if(steps?.length) await db.from('recipe_steps').insert(
    steps.map(s=>({ recipe_id:newRecipe.id, step_order:s.step_order, description:s.description }))
  );

  showToast('✓ Copy แล้ว — กำลังเปิด Edit...');
  await loadRecipes();
  // เปิด edit form ของ copy ใหม่ทันที
  setTimeout(()=>editRecipe(newRecipe.id), 500);
}
  
// ── NAV ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+(tab==='recipes'?'Recipes':'Ingredients')).classList.add('active');
  showScreen(tab);
}

function goRecipes() { switchTab('recipes'); }

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

init();
</script>
